[project]
name = "heart-disease-prediction-api"
version = "0.1.0"
description = "Heart Disease Prediction API using FastAPI and scikit-learn"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.1",
    "pydantic==2.8.2",
    "scikit-learn==1.6.1",
    "joblib==1.4.2",
    "pandas==2.2.3",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "httpx==0.28.1",
]

[tool.uv]
required-version = ">=0.5.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
